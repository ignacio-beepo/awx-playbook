---
- name: Ubuntu 24.04 CIS Benchmark Audit
  hosts: ubuntu_2404
  become: true
  gather_facts: true

  tasks:
    - name: Validate operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
        fail_msg: "This playbook only supports Ubuntu 24.04"

    - name: Initialize CIS audit results
      ansible.builtin.set_fact:
        cis_results: []

    - name: Execute Section 1 Filesystem
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/section_1.yml

    # - name: Execute Section 5 audit controls
    #   ansible.builtin.include_tasks:
    #     file: ../controls/ubuntu2404/section_5.yml

    # - name: "1.1.1.1 | Ensure cramfs kernel module is not available"
    #   ansible.builtin.include_tasks:
    #     file: ../controls/ubuntu2404/1.1.1.1_Ensure_cramfs_kernel_module_is_not_available.yml

    - name: "7.1.2 | Ensure access to /etc/passwd- is configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.2_Ensure_access_to_etc_passwd_dash_is_configured.yml

    - name: "7.1.3 | Ensure access to /etc/group is configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.3_Ensure_access_to_etc_group_is_configured.yml

    - name: "7.1.4 | Ensure access to /etc/group- is configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.4_Ensure_access_to_etc_group_dash_is_configured.yml

    - name: "7.1.5 | Ensure access to /etc/shadow is configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.5_Ensure_access_to_etc_shadow_is_configured.yml

    - name: "7.1.6 | Ensure access to /etc/shadow- is configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.6_Ensure_access_to_etc_shadow_dash_is_configured.yml

    - name: "7.1.7 | Ensure access to /etc/gshadow is configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.7_Ensure_access_to_etc_gshadow_is_configured.yml

    - name: "7.1.8 | Ensure access to /etc/gshadow- is configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.8_Ensure_access_to_etc_gshadow_dash_is_configured.yml

    - name: "7.1.9 | Ensure access to /etc/shells is configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.9_Ensure_access_to_etc_shells_is_configured.yml

    - name: "7.1.10 | Ensure access to /etc/security/opasswd is configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.10_Ensure_access_to_opasswd_is_configured.yml

    - name: "7.1.11 | Ensure world writable files and directories are secured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.11_Ensure_world_writable_files_and_directories_are_secured.yml

    - name: "7.1.12 | Ensure no files or directories without an owner and a group exist"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.1.12_Ensure_no_unowned_or_ungrouped_files_exist.yml

    - name: "7.2.1 | Ensure accounts in /etc/passwd use shadowed passwords"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.2.1_Ensure_accounts_in_passwd_use_shadowed_passwords.yml

    - name: "7.2.2 | Ensure /etc/shadow password fields are not empty"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.2.2_Ensure_shadow_password_fields_are_not_empty.yml

    - name: "7.2.3 | Ensure all groups in /etc/passwd exist in /etc/group"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.2.3_Ensure_all_groups_in_passwd_exist_in_group.yml

    - name: "7.2.4 | Ensure shadow group is empty"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.2.4_Ensure_shadow_group_is_empty.yml

    - name: "7.2.5 | Ensure no duplicate UIDs exist"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.2.5_Ensure_no_duplicate_UIDs_exist.yml

    - name: "7.2.6 | Ensure no duplicate GIDs exist"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.2.6_Ensure_no_duplicate_GIDs_exist.yml

    - name: "7.2.7 | Ensure no duplicate user names exist"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.2.7_Ensure_no_duplicate_user_names_exist.yml

    - name: "7.2.8 | Ensure no duplicate group names exist"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.2.8_Ensure_no_duplicate_group_names_exist.yml

    - name: "7.2.9 | Ensure local interactive user home directories are configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.2.9_Ensure_local_interactive_user_home_directories_are_configured.yml

    - name: "7.2.10 | Ensure local interactive user dot files access is configured"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/7.2.10_Ensure_local_interactive_user_dot_files_access_is_configured.yml

    - name: Calculate audit statistics
      ansible.builtin.set_fact:
        cis_total: "{{ cis_results | length }}"
        cis_passed: >-
          {{ cis_results | selectattr('status', 'equalto', 'PASS') | list | length }}
        cis_failed: >-
          {{ cis_results | selectattr('status', 'equalto', 'FAIL') | list | length }}
        cis_errors: >-
          {{ cis_results | selectattr('status', 'equalto', 'ERROR') | list | length }}

    - name: Display audit summary
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          benchmark: "CIS Ubuntu 24.04 v2.0.0"
          total: "{{ cis_total }}"
          passed: "{{ cis_passed }}"
          failed: "{{ cis_failed }}"
          errors: "{{ cis_errors }}"
