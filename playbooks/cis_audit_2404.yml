---
- name: Ubuntu 24.04 CIS Benchmark Audit
  hosts: ubuntu_2404
  become: true
  gather_facts: true

  tasks:
    - name: Validate operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
        fail_msg: "This playbook only supports Ubuntu 24.04"

    - name: Initialize CIS audit results
      ansible.builtin.set_fact:
        cis_results: []

    # - name: Execute Section 1 Filesystem
    #   ansible.builtin.include_tasks:
    #     file: ../controls/ubuntu2404/section_1.yml

    # - name: Execute Section 5 audit controls
    #   ansible.builtin.include_tasks:
    #     file: ../controls/ubuntu2404/section_5.yml

    - name: "1.1.1.1 | Ensure cramfs kernel module is not available"
      ansible.builtin.include_tasks:
        file: ../controls/ubuntu2404/1.1.1.1_Ensure_cramfs_kernel_module_is_not_available.yml

    - name: Calculate audit statistics
      ansible.builtin.set_fact:
        cis_total: "{{ cis_results | length }}"
        cis_passed: >-
          {{ cis_results | selectattr('status', 'equalto', 'PASS') | list | length }}
        cis_failed: >-
          {{ cis_results | selectattr('status', 'equalto', 'FAIL') | list | length }}
        cis_errors: >-
          {{ cis_results | selectattr('status', 'equalto', 'ERROR') | list | length }}

    - name: Display audit summary
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          benchmark: "CIS Ubuntu 24.04 v2.0.0"
          total: "{{ cis_total }}"
          passed: "{{ cis_passed }}"
          failed: "{{ cis_failed }}"
          errors: "{{ cis_errors }}"
