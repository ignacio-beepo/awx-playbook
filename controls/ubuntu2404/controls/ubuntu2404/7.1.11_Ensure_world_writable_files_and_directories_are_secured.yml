---
##############################################################################
# AUDIT
##############################################################################

- name: Audit world writable files
  shell: |
    find / -type f -perm -0002 2>/dev/null
  register: world_writable_files
  changed_when: false
  failed_when: false

- name: Audit world writable directories without sticky bit
  shell: |
    find / -type d -perm -0002 ! -perm -1000 2>/dev/null
  register: world_writable_dirs
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    world_writable_compliant: >-
      {{
        (world_writable_files.stdout_lines | length == 0)
        and
        (world_writable_dirs.stdout_lines | length == 0)
      }}

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - No insecure world writable files/directories found'
        if world_writable_compliant
        else
        'FAIL - Insecure world writable files/directories found. Starting remediation...'
      }}

##############################################################################
# REMEDIATION - WORLD WRITABLE FILES
##############################################################################

- name: Remove other write permission from world writable files
  ansible.builtin.file:
    path: "{{ item }}"
    mode: o-w
  loop: "{{ world_writable_files.stdout_lines }}"
  when:
    - world_writable_files.stdout_lines | length > 0

##############################################################################
# REMEDIATION - WORLD WRITABLE DIRECTORIES
##############################################################################

- name: Add sticky bit to world writable directories
  shell: |
    chmod a+t "{{ item }}"
  loop: "{{ world_writable_dirs.stdout_lines }}"
  when:
    - world_writable_dirs.stdout_lines | length > 0
  changed_when: true
  failed_when: false

##############################################################################
# RECHECK
##############################################################################

- name: Re-audit world writable files
  shell: |
    find / -type f -perm -0002 2>/dev/null
  register: world_writable_files_verify
  changed_when: false
  failed_when: false

- name: Re-audit world writable directories without sticky bit
  shell: |
    find / -type d -perm -0002 ! -perm -1000 2>/dev/null
  register: world_writable_dirs_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - world_writable_files_verify.stdout_lines | length == 0
      - world_writable_dirs_verify.stdout_lines | length == 0

    success_msg: |
      PASS - CIS 7.1.11 compliant

      Validation Result:
      - No world writable files exist
      - All world writable directories have sticky bit set
      - Permissions successfully remediated

    fail_msg: |
      FAIL - CIS 7.1.11 non-compliant

      World Writable Files:
      {{ world_writable_files_verify.stdout | default('None') }}

      World Writable Directories Without Sticky Bit:
      {{ world_writable_dirs_verify.stdout | default('None') }}
