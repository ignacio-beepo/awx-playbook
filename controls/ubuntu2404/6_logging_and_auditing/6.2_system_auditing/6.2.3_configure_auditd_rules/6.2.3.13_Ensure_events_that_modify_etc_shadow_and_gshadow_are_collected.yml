---
##############################################################################
# AUDIT
##############################################################################

- name: Check running audit rules for /etc/shadow and /etc/gshadow
  shell: |
    auditctl -l 2>/dev/null | grep shadow || true
  register: shadow_running
  changed_when: false
  failed_when: false

- name: Check persistent audit rules for /etc/shadow and /etc/gshadow
  shell: |
    grep shadow /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: shadow_persistent
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    shadow_identity_compliant: >-
      {{
        ('-w /etc/shadow -p wa -k identity' in shadow_running.stdout)
        and
        ('-w /etc/gshadow -p wa -k identity' in shadow_running.stdout)
        and
        ('-w /etc/shadow -p wa -k identity' in shadow_persistent.stdout)
        and
        ('-w /etc/gshadow -p wa -k identity' in shadow_persistent.stdout)
      }}

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - /etc/shadow and /etc/gshadow auditing configured'
        if shadow_identity_compliant
        else
        'FAIL - /etc/shadow and /etc/gshadow auditing missing. Starting remediation...'
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Ensure identity audit rules file exists
  file:
    path: /etc/audit/rules.d/50-identity.rules
    state: touch
    owner: root
    group: root
    mode: "0640"
  when: not shadow_identity_compliant

- name: Configure shadow identity audit rule
  lineinfile:
    path: /etc/audit/rules.d/50-identity.rules
    line: "-w /etc/shadow -p wa -k identity"
    state: present
  when: not shadow_identity_compliant

- name: Configure gshadow identity audit rule
  lineinfile:
    path: /etc/audit/rules.d/50-identity.rules
    line: "-w /etc/gshadow -p wa -k identity"
    state: present
  when: not shadow_identity_compliant

- name: Load audit rules
  command: augenrules --load
  register: augenrules_result
  changed_when: true
  failed_when: false
  when: not shadow_identity_compliant

- name: Check audit enabled mode
  shell: |
    auditctl -s | grep enabled || true
  register: audit_enabled_state
  changed_when: false
  failed_when: false

- name: Display reboot recommendation
  debug:
    msg: "Reboot required to fully load audit rules"
  when:
    - audit_enabled_state.stdout is search('enabled 2')
    - not shadow_identity_compliant

##############################################################################
# RECHECK
##############################################################################

- name: Recheck running audit rules
  shell: |
    auditctl -l 2>/dev/null | grep shadow || true
  register: shadow_running_verify
  changed_when: false
  failed_when: false

- name: Recheck persistent audit rules
  shell: |
    grep shadow /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: shadow_persistent_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - "'-w /etc/shadow -p wa -k identity' in shadow_running_verify.stdout"
      - "'-w /etc/gshadow -p wa -k identity' in shadow_running_verify.stdout"
      - "'-w /etc/shadow -p wa -k identity' in shadow_persistent_verify.stdout"
      - "'-w /etc/gshadow -p wa -k identity' in shadow_persistent_verify.stdout"

    success_msg: |
      PASS - CIS 6.2.3.13 compliant

      Validation Result:
      - /etc/shadow monitored
      - /etc/gshadow monitored
      - identity audit key configured
      - running audit rules updated
      - persistent audit rules updated

    fail_msg: |
      FAIL - CIS 6.2.3.13 non-compliant

      Running Rules:
      {{ shadow_running_verify.stdout }}

      Persistent Rules:
      {{ shadow_persistent_verify.stdout }}
