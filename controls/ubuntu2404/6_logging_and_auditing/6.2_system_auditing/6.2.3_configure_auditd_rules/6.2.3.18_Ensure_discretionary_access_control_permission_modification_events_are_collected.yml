---
##############################################################################
# AUDIT
##############################################################################

- name: Check running perm_mod audit rules
  shell: |
    auditctl -l 2>/dev/null | grep perm_mod || true
  register: perm_mod_running
  changed_when: false
  failed_when: false

- name: Check persistent perm_mod audit rules
  shell: |
    grep perm_mod /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: perm_mod_persistent
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    perm_mod_compliant: >-
      {{
        ('perm_mod' in perm_mod_running.stdout)
        and
        ('perm_mod' in perm_mod_persistent.stdout)
      }}

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - Permission modification auditing configured'
        if perm_mod_compliant
        else
        'FAIL - Permission modification auditing missing. Starting remediation...'
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Create perm_mod audit rules
  copy:
    dest: /etc/audit/rules.d/50-perm_mod.rules
    owner: root
    group: root
    mode: "0640"
    content: |
      ## Company Scope - OS Filesystem Only

      -a always,exit -F arch=b64 -F dir=/etc      -S chmod,fchmod,fchmodat,chown,fchown,fchownat,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -F dir=/bin      -S chmod,fchmod,fchmodat,chown,fchown,fchownat,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -F dir=/sbin     -S chmod,fchmod,fchmodat,chown,fchown,fchownat,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -F dir=/usr/bin  -S chmod,fchmod,fchmodat,chown,fchown,fchownat,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -F dir=/usr/sbin -S chmod,fchmod,fchmodat,chown,fchown,fchownat,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -F dir=/var      -S chmod,fchmod,fchmodat,chown,fchown,fchownat,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -F dir=/home     -S chmod,fchmod,fchmodat,chown,fchown,fchownat,lchown,setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
  when: not perm_mod_compliant

- name: Load audit rules
  command: augenrules --load
  register: augenrules_result
  changed_when: true
  failed_when: false
  when: not perm_mod_compliant

- name: Check audit enabled state
  shell: |
    auditctl -s | grep enabled || true
  register: audit_enabled_state
  changed_when: false
  failed_when: false

- name: Display reboot recommendation
  debug:
    msg: "Reboot required to fully load audit rules"
  when:
    - audit_enabled_state.stdout is search('enabled 2')
    - not perm_mod_compliant

##############################################################################
# RECHECK
##############################################################################

- name: Recheck running perm_mod rules
  shell: |
    auditctl -l 2>/dev/null | grep perm_mod || true
  register: perm_mod_running_verify
  changed_when: false
  failed_when: false

- name: Recheck persistent perm_mod rules
  shell: |
    grep perm_mod /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: perm_mod_persistent_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - "'perm_mod' in perm_mod_running_verify.stdout"
      - "'perm_mod' in perm_mod_persistent_verify.stdout"

    success_msg: |
      PASS - CIS 6.2.3.18 compliant (Company Standard)

      Validation Result:
      - Permission modification monitoring enabled
      - perm_mod audit key configured
      - Running audit rules updated
      - Persistent audit rules updated

      Company Scope:
      /etc
      /bin
      /sbin
      /usr/bin
      /usr/sbin
      /var
      /home

    fail_msg: |
      FAIL - CIS 6.2.3.18 non-compliant

      Running Rules:
      {{ perm_mod_running_verify.stdout }}

      Persistent Rules:
      {{ perm_mod_persistent_verify.stdout }}
