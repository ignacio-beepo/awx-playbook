---
##############################################################################
# AUDIT
##############################################################################

- name: Check if /etc/netplan exists
  stat:
    path: /etc/netplan
  register: netplan_dir

- name: Check running audit rules for /etc/netplan
  shell: |
    auditctl -l 2>/dev/null | grep '/etc/netplan' || true
  register: netplan_running
  changed_when: false
  failed_when: false
  when: netplan_dir.stat.exists

- name: Check persistent audit rules for /etc/netplan
  shell: |
    grep '/etc/netplan' /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: netplan_persistent
  changed_when: false
  failed_when: false
  when: netplan_dir.stat.exists

- name: Determine compliance status
  set_fact:
    netplan_compliant: "{{ (not netplan_dir.stat.exists) or (('-w /etc/netplan -p wa -k system-locale' in netplan_running.stdout) and ('-w /etc/netplan -p wa -k system-locale' in netplan_persistent.stdout)) }}"

- name: Show audit result
  debug:
    msg: "{{ 'PASS - Netplan auditing configured' if netplan_compliant else 'FAIL - Netplan auditing missing. Starting remediation...' }}"

##############################################################################
# REMEDIATION
##############################################################################

- name: Create netplan audit rules
  copy:
    dest: /etc/audit/rules.d/50-netplan_system_locale.rules
    owner: root
    group: root
    mode: "0640"
    content: |
      -w /etc/netplan -p wa -k system-locale
  when:
    - netplan_dir.stat.exists
    - not netplan_compliant

- name: Load audit rules
  command: augenrules --load
  register: augenrules_result
  changed_when: true
  failed_when: false
  when:
    - netplan_dir.stat.exists
    - not netplan_compliant

- name: Check audit enabled state
  shell: |
    auditctl -s | grep enabled || true
  register: audit_enabled_state
  changed_when: false
  failed_when: false

- name: Display reboot recommendation
  debug:
    msg: "Reboot required to fully load audit rules"
  when:
    - netplan_dir.stat.exists
    - not netplan_compliant
    - audit_enabled_state.stdout is search('enabled 2')

##############################################################################
# RECHECK
##############################################################################

- name: Recheck running audit rules
  shell: |
    auditctl -l 2>/dev/null | grep '/etc/netplan' || true
  register: netplan_running_verify
  changed_when: false
  failed_when: false
  when: netplan_dir.stat.exists

- name: Recheck persistent audit rules
  shell: |
    grep '/etc/netplan' /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: netplan_persistent_verify
  changed_when: false
  failed_when: false
  when: netplan_dir.stat.exists

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - netplan_compliant

    success_msg: |
      PASS - CIS 6.2.3.9 compliant

      Validation Result:
      - /etc/netplan monitored

      OR

      - /etc/netplan does not exist (PASS state)

    fail_msg: |
      FAIL - CIS 6.2.3.9 non-compliant

      Running Rules:
      {{ netplan_running_verify.stdout | default('Not Found') }}

      Persistent Rules:
      {{ netplan_persistent_verify.stdout | default('Not Found') }}
