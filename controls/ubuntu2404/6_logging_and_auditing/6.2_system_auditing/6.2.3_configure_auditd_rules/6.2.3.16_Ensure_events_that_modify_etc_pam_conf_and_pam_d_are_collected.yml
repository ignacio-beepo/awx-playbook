---
##############################################################################
# AUDIT
##############################################################################

- name: Check running audit rules for /etc/pam.conf and /etc/pam.d
  shell: |
    auditctl -l 2>/dev/null | grep -E '/etc/pam.conf|/etc/pam.d' || true
  register: pam_running
  changed_when: false
  failed_when: false

- name: Check persistent audit rules for /etc/pam.conf and /etc/pam.d
  shell: |
    grep -E '/etc/pam.conf|/etc/pam.d' \
    /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: pam_persistent
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    pam_identity_compliant: >-
      {{
        ('-w /etc/pam.conf -p wa -k identity' in pam_running.stdout)
        and
        ('-w /etc/pam.d -p wa -k identity' in pam_running.stdout)
        and
        ('-w /etc/pam.conf -p wa -k identity' in pam_persistent.stdout)
        and
        ('-w /etc/pam.d -p wa -k identity' in pam_persistent.stdout)
      }}

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - PAM auditing configured'
        if pam_identity_compliant
        else
        'FAIL - PAM auditing missing. Starting remediation...'
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Ensure identity audit rules file exists
  file:
    path: /etc/audit/rules.d/50-identity.rules
    state: touch
    owner: root
    group: root
    mode: "0640"
  when: not pam_identity_compliant

- name: Configure pam.conf identity audit rule
  lineinfile:
    path: /etc/audit/rules.d/50-identity.rules
    line: "-w /etc/pam.conf -p wa -k identity"
    state: present
  when: not pam_identity_compliant

- name: Configure pam.d identity audit rule
  lineinfile:
    path: /etc/audit/rules.d/50-identity.rules
    line: "-w /etc/pam.d -p wa -k identity"
    state: present
  when: not pam_identity_compliant

- name: Load audit rules
  command: augenrules --load
  register: augenrules_result
  changed_when: true
  failed_when: false
  when: not pam_identity_compliant

- name: Check audit enabled mode
  shell: |
    auditctl -s | grep enabled || true
  register: audit_enabled_state
  changed_when: false
  failed_when: false

- name: Display reboot recommendation
  debug:
    msg: "Reboot required to fully load audit rules"
  when:
    - audit_enabled_state.stdout is search('enabled 2')
    - not pam_identity_compliant

##############################################################################
# RECHECK
##############################################################################

- name: Recheck running audit rules
  shell: |
    auditctl -l 2>/dev/null | grep -E '/etc/pam.conf|/etc/pam.d' || true
  register: pam_running_verify
  changed_when: false
  failed_when: false

- name: Recheck persistent audit rules
  shell: |
    grep -E '/etc/pam.conf|/etc/pam.d' \
    /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: pam_persistent_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - "'-w /etc/pam.conf -p wa -k identity' in pam_running_verify.stdout"
      - "'-w /etc/pam.d -p wa -k identity' in pam_running_verify.stdout"
      - "'-w /etc/pam.conf -p wa -k identity' in pam_persistent_verify.stdout"
      - "'-w /etc/pam.d -p wa -k identity' in pam_persistent_verify.stdout"

    success_msg: |
      PASS - CIS 6.2.3.16 compliant

      Validation Result:
      - /etc/pam.conf monitored
      - /etc/pam.d monitored
      - identity audit key configured
      - running audit rules updated
      - persistent audit rules updated

    fail_msg: |
      FAIL - CIS 6.2.3.16 non-compliant

      Running Rules:
      {{ pam_running_verify.stdout }}

      Persistent Rules:
      {{ pam_persistent_verify.stdout }}
