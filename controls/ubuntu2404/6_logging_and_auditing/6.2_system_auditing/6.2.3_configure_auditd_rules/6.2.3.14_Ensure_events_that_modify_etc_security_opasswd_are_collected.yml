---
##############################################################################
# AUDIT
##############################################################################

- name: Check running audit rules for /etc/security/opasswd
  shell: |
    auditctl -l 2>/dev/null | grep '/etc/security/opasswd' || true
  register: opasswd_running
  changed_when: false
  failed_when: false

- name: Check persistent audit rules for /etc/security/opasswd
  shell: |
    grep '/etc/security/opasswd' /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: opasswd_persistent
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    opasswd_identity_compliant: >-
      {{
        ('-w /etc/security/opasswd -p wa -k identity'
        in opasswd_running.stdout)
        and
        ('-w /etc/security/opasswd -p wa -k identity'
        in opasswd_persistent.stdout)
      }}

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - /etc/security/opasswd auditing configured'
        if opasswd_identity_compliant
        else
        'FAIL - /etc/security/opasswd auditing missing. Starting remediation...'
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Ensure identity audit rules file exists
  file:
    path: /etc/audit/rules.d/50-identity.rules
    state: touch
    owner: root
    group: root
    mode: "0640"
  when: not opasswd_identity_compliant

- name: Configure opasswd identity audit rule
  lineinfile:
    path: /etc/audit/rules.d/50-identity.rules
    line: "-w /etc/security/opasswd -p wa -k identity"
    state: present
  when: not opasswd_identity_compliant

- name: Load audit rules
  command: augenrules --load
  register: augenrules_result
  changed_when: true
  failed_when: false
  when: not opasswd_identity_compliant

- name: Check audit enabled mode
  shell: |
    auditctl -s | grep enabled || true
  register: audit_enabled_state
  changed_when: false
  failed_when: false

- name: Display reboot recommendation
  debug:
    msg: "Reboot required to fully load audit rules"
  when:
    - audit_enabled_state.stdout is search('enabled 2')
    - not opasswd_identity_compliant

##############################################################################
# RECHECK
##############################################################################

- name: Recheck running audit rules
  shell: |
    auditctl -l 2>/dev/null | grep '/etc/security/opasswd' || true
  register: opasswd_running_verify
  changed_when: false
  failed_when: false

- name: Recheck persistent audit rules
  shell: |
    grep '/etc/security/opasswd' /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: opasswd_persistent_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - "'-w /etc/security/opasswd -p wa -k identity' in opasswd_running_verify.stdout"
      - "'-w /etc/security/opasswd -p wa -k identity' in opasswd_persistent_verify.stdout"

    success_msg: |
      PASS - CIS 6.2.3.14 compliant

      Validation Result:
      - /etc/security/opasswd monitored
      - identity audit key configured
      - running audit rules updated
      - persistent audit rules updated

    fail_msg: |
      FAIL - CIS 6.2.3.14 non-compliant

      Running Rules:
      {{ opasswd_running_verify.stdout }}

      Persistent Rules:
      {{ opasswd_persistent_verify.stdout }}
