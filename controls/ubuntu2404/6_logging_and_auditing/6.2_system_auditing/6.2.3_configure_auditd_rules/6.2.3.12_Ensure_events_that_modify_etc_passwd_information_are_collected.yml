---
##############################################################################
# AUDIT
##############################################################################

- name: Check running audit rules for /etc/passwd
  shell: |
    auditctl -l 2>/dev/null | grep -P '^\s*-w\s+/etc/passwd\s+' || true
  register: passwd_running
  changed_when: false
  failed_when: false

- name: Check persistent audit rules for /etc/passwd
  shell: |
    grep -P '^\s*-w\s+/etc/passwd\s+' \
    /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: passwd_persistent
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    passwd_identity_compliant: >-
      {{
        ('-w /etc/passwd -p wa -k identity' in passwd_running.stdout)
        and
        ('-w /etc/passwd -p wa -k identity' in passwd_persistent.stdout)
      }}

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - /etc/passwd auditing configured'
        if passwd_identity_compliant
        else
        'FAIL - /etc/passwd auditing missing. Starting remediation...'
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Ensure identity audit rules file exists
  file:
    path: /etc/audit/rules.d/50-identity.rules
    state: touch
    owner: root
    group: root
    mode: "0640"
  when: not passwd_identity_compliant

- name: Configure passwd identity audit rule
  lineinfile:
    path: /etc/audit/rules.d/50-identity.rules
    line: "-w /etc/passwd -p wa -k identity"
    state: present
  when: not passwd_identity_compliant

- name: Load audit rules
  command: augenrules --load
  register: augenrules_result
  changed_when: true
  failed_when: false
  when: not passwd_identity_compliant

- name: Check audit enabled mode
  shell: |
    auditctl -s | grep enabled || true
  register: audit_enabled_state
  changed_when: false
  failed_when: false

- name: Display reboot recommendation
  debug:
    msg: "Reboot required to fully load audit rules"
  when:
    - audit_enabled_state.stdout is search('enabled 2')
    - not passwd_identity_compliant

##############################################################################
# RECHECK
##############################################################################

- name: Recheck running audit rules
  shell: |
    auditctl -l 2>/dev/null | grep -P '^\s*-w\s+/etc/passwd\s+' || true
  register: passwd_running_verify
  changed_when: false
  failed_when: false

- name: Recheck persistent audit rules
  shell: |
    grep -P '^\s*-w\s+/etc/passwd\s+' \
    /etc/audit/rules.d/*.rules 2>/dev/null || true
  register: passwd_persistent_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - "'-w /etc/passwd -p wa -k identity' in passwd_running_verify.stdout"
      - "'-w /etc/passwd -p wa -k identity' in passwd_persistent_verify.stdout"

    success_msg: |
      PASS - CIS 6.2.3.12 compliant

      Validation Result:
      - /etc/passwd monitored
      - identity audit key configured
      - running audit rules updated
      - persistent audit rules updated

    fail_msg: |
      FAIL - CIS 6.2.3.12 non-compliant

      Running Rules:
      {{ passwd_running_verify.stdout }}

      Persistent Rules:
      {{ passwd_persistent_verify.stdout }}
