---
##############################################################################
# AUDIT
##############################################################################

- name: Check for audit=1 in grub configuration
  shell: |
    find /boot -type f -name 'grub.cfg' -exec \
    grep -Ph '^\h*linux' {} + 2>/dev/null | \
    grep -v 'audit=1' || true
  register: grub_audit_check
  changed_when: false
  failed_when: false

- name: Check if GRUB bootloader exists
  stat:
    path: /etc/default/grub
  register: grub_file

- name: Check approved alternate bootloader exception
  stat:
    path: /etc/cis/BOOTLOADER_AUDIT_EXCEPTION
  register: bootloader_exception

- name: Determine compliance status
  set_fact:
    audit_boot_compliant: >-
      {{
        (
          grub_file.stat.exists
          and
          grub_audit_check.stdout_lines | length == 0
        )
        or
        bootloader_exception.stat.exists
      }}

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - Early boot auditing configured'
        if audit_boot_compliant
        else
        'FAIL - audit=1 kernel parameter missing. Starting remediation...'
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Ensure /etc/default/grub.d exists
  file:
    path: /etc/default/grub.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - grub_file.stat.exists
    - not audit_boot_compliant

- name: Configure audit=1 kernel parameter
  copy:
    dest: /etc/default/grub.d/40-custom-audit.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      GRUB_CMDLINE_LINUX="audit=1"
  when:
    - grub_file.stat.exists
    - not audit_boot_compliant

- name: Update grub configuration
  command: update-grub
  register: update_grub_result
  changed_when: true
  failed_when: false
  when:
    - grub_file.stat.exists
    - not audit_boot_compliant

##############################################################################
# RECHECK
##############################################################################

- name: Recheck audit=1 kernel parameter
  shell: |
    find /boot -type f -name 'grub.cfg' -exec \
    grep -Ph '^\h*linux' {} + 2>/dev/null | \
    grep -v 'audit=1' || true
  register: grub_audit_verify
  changed_when: false
  failed_when: false
  when: grub_file.stat.exists

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - >
        (
          grub_file.stat.exists and
          grub_audit_verify.stdout_lines | length == 0
        )
        or
        bootloader_exception.stat.exists

    success_msg: |
      PASS - CIS 6.2.1.3 compliant

      Validation Result:
      - audit=1 kernel parameter configured

      OR

      - Approved alternate bootloader exception documented

    fail_msg: |
      FAIL - CIS 6.2.1.3 non-compliant

      audit=1 parameter not detected in grub configuration.

      If a non-GRUB bootloader is used, document implementation
      of equivalent auditing controls and create:

      /etc/cis/BOOTLOADER_AUDIT_EXCEPTION
