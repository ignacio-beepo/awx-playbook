---
##############################################################################
# AUDIT
##############################################################################

- name: Check AIDE package installation
  shell: |
    dpkg-query -s aide >/dev/null 2>&1 && \
    dpkg-query -s aide-common >/dev/null 2>&1 && \
    echo INSTALLED || echo MISSING
  register: aide_pkg
  changed_when: false
  failed_when: false

- name: Fail if AIDE is not installed
  fail:
    msg: |
      CIS 6.3.3 prerequisite missing

      AIDE package is not installed.

      Please execute CIS 6.3.1 first:
      Ensure AIDE is installed
  when: aide_pkg.stdout != "INSTALLED"

- name: Check AIDE configuration file
  stat:
    path: /etc/aide/aide.conf
  register: aide_conf

- name: Audit AIDE protection rules for audit tools
  shell: |
    for tool in auditctl auditd ausearch aureport autrace augenrules; do

      tool_path=$(readlink -f /sbin/$tool 2>/dev/null)

      [ -n "$tool_path" ] || continue

      grep -E "^${tool_path}[[:space:]]+p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512$" \
      /etc/aide/aide.conf >/dev/null 2>&1 || \
      echo "$tool_path"

    done
  register: aide_audit_tools
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    aide_audit_tools_compliant: >-
      {{
        aide_conf.stat.exists
        and
        (aide_audit_tools.stdout_lines | length == 0)
      }}

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - Audit tool integrity protection is configured'
        if aide_audit_tools_compliant
        else
        'FAIL - Missing AIDE audit tool rules detected. Starting remediation...'
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Ensure Audit Tools section exists
  lineinfile:
    path: /etc/aide/aide.conf
    line: "# Audit Tools"
    state: present

- name: Add AIDE rules for audit tools
  lineinfile:
    path: /etc/aide/aide.conf
    line: "{{ item }} p+i+n+u+g+s+b+acl+xattrs+sha512"
    state: present
  loop: "{{ aide_audit_tools.stdout_lines }}"
  when:
    - aide_audit_tools.stdout_lines | length > 0

##############################################################################
# RECHECK
##############################################################################

- name: Re-audit AIDE protection rules
  shell: |
    for tool in auditctl auditd ausearch aureport autrace augenrules; do

      tool_path=$(readlink -f /sbin/$tool 2>/dev/null)

      [ -n "$tool_path" ] || continue

      grep -E "^${tool_path}[[:space:]]+p\+i\+n\+u\+g\+s\+b\+acl\+xattrs\+sha512$" \
      /etc/aide/aide.conf >/dev/null 2>&1 || \
      echo "$tool_path"

    done
  register: aide_audit_tools_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - aide_conf.stat.exists
      - aide_audit_tools_verify.stdout_lines | length == 0

    success_msg: |
      PASS - CIS 6.3.3 compliant

      Validation Result:
      - auditctl protected
      - auditd protected
      - ausearch protected
      - aureport protected
      - autrace protected
      - augenrules protected
      - Cryptographic integrity protection enabled
      - SHA512 validation configured

    fail_msg: |
      FAIL - CIS 6.3.3 non-compliant

      Missing AIDE Entries:

      {{ aide_audit_tools_verify.stdout | default('Unknown') }}
