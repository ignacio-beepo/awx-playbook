---
# ============================================================
# CIS Ubuntu 24.04 LTS Benchmark
# Section 1.1.1 - Configure Filesystem Kernel Modules
# ============================================================

- name: Audit CIS Ubuntu 24.04 kernel module controls
  ansible.builtin.include_tasks:
    file: ../common/tasks/kernel_module.yml
  loop:
    - id: "1.1.1.1"
      name: "cramfs"
      title: "Ensure cramfs kernel module is not available"

    - id: "1.1.1.2"
      name: "freevxfs"
      title: "Ensure freevxfs kernel module is not available"

    - id: "1.1.1.3"
      name: "hfs"
      title: "Ensure hfs kernel module is not available"

    - id: "1.1.1.4"
      name: "hfsplus"
      title: "Ensure hfsplus kernel module is not available"

    # 1.1.1.5 - jffs2
    - id: "1.1.1.5"
      title: "Ensure jffs2 kernel module is not available"
      module_path_name: "jffs2"
      module_name: "jffs2"
      module_type: "fs"
      loaded_pattern: "jffs2"
      level_server: "L1"
      level_workstation: "L1"
      remediation_policy: "safe"

    # 1.1.1.6 - overlay
    - id: "1.1.1.6"
      title: "Ensure overlay kernel module is not available"
      module_path_name: "overlayfs"
      module_name: "overlay"
      module_type: "fs"
      loaded_pattern: "overlay"
      level_server: "L2"
      level_workstation: "L2"
      remediation_policy: "manual"

    # 1.1.1.8 - udf
    - id: "1.1.1.8"
      title: "Ensure udf kernel module is not available"
      module_path_name: "udf"
      module_name: "udf"
      module_type: "fs"
      loaded_pattern: "udf"
      level_server: "L2"
      level_workstation: "L2"
      remediation_policy: "manual"

    # 1.1.1.9 - firewire-core
    - id: "1.1.1.9"
      title: "Ensure firewire-core kernel module is not available"
      module_path_name: "firewire"
      module_name: "firewire_core"
      module_type: "drivers"
      loaded_pattern: "firewire(_|-)core"
      level_server: "L1"
      level_workstation: "L2"
      remediation_policy: "conditional"

    # 1.1.1.10 - usb-storage
    - id: "1.1.1.10"
      title: "Ensure usb-storage kernel module is not available"
      module_path_name: "usb-storage"
      module_name: "usb_storage"
      module_type: "drivers"
      loaded_pattern: "usb(_|-)storage"
      level_server: "L1"
      level_workstation: "L2"
      remediation_policy: "conditional"

  loop_control:
    loop_var: cis_control
    label: "{{ cis_control.id }} - {{ cis_control.name }}"

  vars:
    cis_id: "{{ cis_control.id }}"
    cis_module_name: "{{ cis_control.name }}"
    cis_title: "{{ cis_control.title }}"
