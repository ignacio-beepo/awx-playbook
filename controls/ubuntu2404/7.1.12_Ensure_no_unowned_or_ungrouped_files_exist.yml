---
##############################################################################
# AUDIT
##############################################################################

- name: Audit unowned or ungrouped files and directories
  shell: |
    find / \
      -xdev \
      \( -nouser -o -nogroup \) \
      -print 2>/dev/null
  register: orphaned_files
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    orphaned_files_compliant: "{{ orphaned_files.stdout_lines | length == 0 }}"

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - No unowned or ungrouped files/directories found'
        if orphaned_files_compliant
        else
        'FAIL - Unowned or ungrouped files/directories detected. Starting remediation...'
      }}

##############################################################################
# DISPLAY FINDINGS
##############################################################################

- name: Display orphaned files and directories
  debug:
    msg: |
      Unowned/Ungrouped Objects Found:

      {{ orphaned_files.stdout }}

  when: not orphaned_files_compliant

##############################################################################
# REMEDIATION
##############################################################################

- name: Fix ownership of orphaned files and directories
  file:
    path: "{{ item }}"
    owner: root
    group: root
  loop: "{{ orphaned_files.stdout_lines }}"
  when:
    - not orphaned_files_compliant
    - orphaned_files.stdout_lines | length > 0

- name: Show remediation result
  debug:
    msg: |
      Remediation completed.

      Ownership assigned:
      root:root

  when:
    - not orphaned_files_compliant
    - remediation_result is defined

##############################################################################
# RECHECK
##############################################################################

- name: Re-audit unowned or ungrouped files and directories
  shell: |
    find / \
      -xdev \
      \( -nouser -o -nogroup \) \
      -print 2>/dev/null
  register: orphaned_files_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - orphaned_files_verify.stdout_lines | length == 0

    success_msg: |
      PASS - CIS 7.1.12 compliant

      Validation Result:
      - No unowned files found
      - No ungrouped files found
      - Orphaned objects remediated

    fail_msg: |
      FAIL - CIS 7.1.12 non-compliant

      Remaining Findings:

      {{ orphaned_files_verify.stdout | default('Unknown') }}
