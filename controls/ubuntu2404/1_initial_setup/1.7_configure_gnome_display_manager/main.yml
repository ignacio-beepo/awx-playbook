---
- name: Include CIS section controls
  ansible.builtin.include_tasks: "{{ item }}"
  loop:
    - 1.7.1_ensure_gdm_is_removed.yml
    - 1.7.2_ensure_gdm_login_banner_is_configured.yml
    - 1.7.3_ensure_gdm_disable-user-list_option_is_enabled.yml
    - 1.7.4_ensure_gdm_screen_locks_when_the_user_is_idle.yml
    - 1.7.5_ensure_gdm_screen_locks_cannot_be_overridden.yml
    - 1.7.6_ensure_gdm_automatic_mounting_of_removable_media_is_disabled.yml
    - 1.7.7_ensure_xwayland_is_configured.yml
