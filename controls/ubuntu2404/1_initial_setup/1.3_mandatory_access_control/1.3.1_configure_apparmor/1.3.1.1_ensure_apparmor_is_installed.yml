---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 1.3.1.1 | Assessment -> Remediation -> Recheck
# Non-compliance is reported; it does not fail the Ansible task.
##############################################################################

- name: Audit CIS 1.3.1.1
  ansible.builtin.shell: |
    dpkg-query -W -f='${Status}' apparmor 2>/dev/null | grep -q 'install ok installed' && echo COMPLIANT || echo NON_COMPLIANT
  args:
    executable: /bin/bash
  register: cis_1_3_1_1_audit
  changed_when: false
  failed_when: false

- name: Determine compliance status for CIS 1.3.1.1
  ansible.builtin.set_fact:
    cis_1_3_1_1_compliant: "{{ (cis_1_3_1_1_audit.stdout_lines | default([]) | first | default('')) == 'COMPLIANT' }}"
- name: Show audit result for CIS 1.3.1.1
  ansible.builtin.debug:
    msg: "{{ 'PASS' if cis_1_3_1_1_compliant else 'NON-COMPLIANT' }} - CIS 1.3.1.1: {{ cis_1_3_1_1_audit.stdout | default('No audit output') }}"

##############################################################################
# REMEDIATION
##############################################################################

- name: Remediate CIS 1.3.1.1
  block:
    - name: Remediate CIS 1.3.1.1
      ansible.builtin.apt:
        name: [apparmor, apparmor-utils]
        state: present
        update_cache: true
  when:
    - cis_remediate | default(false) | bool
    - not cis_1_3_1_1_compliant | default(false)

##############################################################################
# RECHECK
##############################################################################

- name: Recheck CIS 1.3.1.1
  ansible.builtin.shell: |
    dpkg-query -W -f='${Status}' apparmor 2>/dev/null | grep -q 'install ok installed' && echo COMPLIANT || echo NON_COMPLIANT
  args:
    executable: /bin/bash
  register: cis_1_3_1_1_verify
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool
- name: Show recheck result for CIS 1.3.1.1
  ansible.builtin.debug:
    msg: "{{ 'PASS' if (cis_1_3_1_1_verify.stdout_lines | default([]) | first | default('')) == 'COMPLIANT' else 'NON-COMPLIANT / MANUAL REVIEW' }} - CIS 1.3.1.1: {{ cis_1_3_1_1_verify.stdout | default('Recheck not run') }}"
  when: cis_remediate | default(false) | bool

