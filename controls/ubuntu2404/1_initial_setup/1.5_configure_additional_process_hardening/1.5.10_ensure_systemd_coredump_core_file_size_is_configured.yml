---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 1.5.10 | Assessment -> Remediation -> Recheck
# Non-compliance is reported; it does not fail the Ansible task.
##############################################################################
- name: Audit CIS 1.5.10
  ansible.builtin.shell: |
    echo MANUAL_REVIEW
  args:
    executable: /bin/bash
  register: cis_1_5_10_audit
  changed_when: false
  failed_when: false

- name: Record manual review for CIS 1.5.10
  ansible.builtin.set_fact:
    cis_1_5_10_compliant: false
    cis_1_5_10_manual_review: true
- name: Show audit result for CIS 1.5.10
  ansible.builtin.debug:
    msg: "MANUAL REVIEW - CIS 1.5.10: {{ cis_1_5_10_audit.stdout | default('No audit output') }}"

##############################################################################
# REMEDIATION
##############################################################################
- name: Remediate CIS 1.5.10
  block:
    - name: Manual remediation notice for CIS 1.5.10
      ansible.builtin.debug:
        msg: >-
          Verify the exact 1.5.10 recommendation and value against the CIS v2.0.0 PDF before implementing. This control is deliberately manual pending confirmation.
  when:
    - cis_remediate | default(false) | bool
    - not cis_1_5_10_compliant | default(false)

##############################################################################
# RECHECK
##############################################################################
- name: Recheck CIS 1.5.10
  ansible.builtin.shell: |
    echo MANUAL_REVIEW
  args:
    executable: /bin/bash
  register: cis_1_5_10_verify
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool
- name: Show recheck result for CIS 1.5.10
  ansible.builtin.debug:
    msg: "{{ 'PASS' if (cis_1_5_10_verify.stdout_lines | default([]) | first | default('')) == 'COMPLIANT' else 'NON-COMPLIANT / MANUAL REVIEW' }} - CIS 1.5.10: {{ cis_1_5_10_verify.stdout | default('Recheck not run') }}"
  when: cis_remediate | default(false) | bool

