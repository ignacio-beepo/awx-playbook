---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 1.5.6 | Assessment -> Remediation -> Recheck
# Non-compliance is reported; it does not fail the Ansible task.
##############################################################################
- name: Audit CIS 1.5.6
  ansible.builtin.shell: |
    if dpkg-query -W -f='${Status}' prelink 2>/dev/null | grep -q 'install ok installed'; then echo NON_COMPLIANT; else echo COMPLIANT; fi
  args:
    executable: /bin/bash
  register: cis_1_5_6_audit
  changed_when: false
  failed_when: false

- name: Determine compliance status for CIS 1.5.6
  ansible.builtin.set_fact:
    cis_1_5_6_compliant: "{{ (cis_1_5_6_audit.stdout_lines | default([]) | first | default('')) == 'COMPLIANT' }}"
- name: Show audit result for CIS 1.5.6
  ansible.builtin.debug:
    msg: "{{ 'PASS' if cis_1_5_6_compliant else 'NON-COMPLIANT' }} - CIS 1.5.6: {{ cis_1_5_6_audit.stdout | default('No audit output') }}"

##############################################################################
# REMEDIATION
##############################################################################
- name: Remediate CIS 1.5.6
  block:
    - name: Remove prelink package
      ansible.builtin.apt:
        name: prelink
        state: absent
        purge: true
  when:
    - cis_remediate | default(false) | bool
    - not cis_1_5_6_compliant | default(false)

##############################################################################
# RECHECK
##############################################################################
- name: Recheck CIS 1.5.6
  ansible.builtin.shell: |
    if dpkg-query -W -f='${Status}' prelink 2>/dev/null | grep -q 'install ok installed'; then echo NON_COMPLIANT; else echo COMPLIANT; fi
  args:
    executable: /bin/bash
  register: cis_1_5_6_verify
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool
- name: Show recheck result for CIS 1.5.6
  ansible.builtin.debug:
    msg: "{{ 'PASS' if (cis_1_5_6_verify.stdout_lines | default([]) | first | default('')) == 'COMPLIANT' else 'NON-COMPLIANT / MANUAL REVIEW' }} - CIS 1.5.6: {{ cis_1_5_6_verify.stdout | default('Recheck not run') }}"
  when: cis_remediate | default(false) | bool

