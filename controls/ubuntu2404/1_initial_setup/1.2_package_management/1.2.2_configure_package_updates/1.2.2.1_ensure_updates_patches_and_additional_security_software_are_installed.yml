---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 1.2.2.1 | Assessment -> Remediation -> Recheck
# Non-compliance is reported and does not fail the Ansible task.
##############################################################################

- name: Audit CIS 1.2.2.1
  ansible.builtin.shell: |
    n="$(apt list --upgradable 2>/dev/null | tail -n +2 | sed '/^$/d' | wc -l)"
    pkg="not-installed"; dpkg-query -W -f='${Status}' unattended-upgrades 2>/dev/null | grep -q 'install ok installed' && pkg=installed
    en="$(systemctl is-enabled apt-daily-upgrade.timer 2>/dev/null || true)"
    ac="$(systemctl is-active apt-daily-upgrade.timer 2>/dev/null || true)"
    echo MANUAL_REVIEW_REQUIRED
    echo "Upgradable packages: $n; unattended-upgrades: $pkg; apt-daily-upgrade.timer enabled=${en:-unknown}, active=${ac:-unknown}"
    echo "Verify patching policy, security updates, additional security software and maintenance records manually."
  args:
    executable: /bin/bash
  register: cis_1_2_2_1_audit
  changed_when: false
  failed_when: false
- name: Record manual review status for CIS 1.2.2.1
  ansible.builtin.set_fact:
    cis_1_2_2_1_compliant: "{{ (cis_1_2_2_1_audit.stdout_lines | default([]) | first | default('')) == 'COMPLIANT' }}"
    cis_1_2_2_1_manual_review: true

- name: Show audit result for CIS 1.2.2.1
  ansible.builtin.debug:
    msg: "MANUAL REVIEW - CIS 1.2.2.1: {{ cis_1_2_2_1_audit.stdout | default('No audit output') }}"

##############################################################################
# REMEDIATION
##############################################################################

- name: Manual remediation notice for CIS 1.2.2.1
  ansible.builtin.debug:
    msg: >-
      Manual control: apply the organization's approved patching process, install required updates and additional security software, and retain maintenance evidence. Package upgrades and reboots are not performed automatically.
  when: cis_remediate | default(false) | bool

##############################################################################
# RECHECK
##############################################################################

- name: Recheck CIS 1.2.2.1
  ansible.builtin.shell: |
    n="$(apt list --upgradable 2>/dev/null | tail -n +2 | sed '/^$/d' | wc -l)"
    pkg="not-installed"; dpkg-query -W -f='${Status}' unattended-upgrades 2>/dev/null | grep -q 'install ok installed' && pkg=installed
    en="$(systemctl is-enabled apt-daily-upgrade.timer 2>/dev/null || true)"
    ac="$(systemctl is-active apt-daily-upgrade.timer 2>/dev/null || true)"
    echo MANUAL_REVIEW_REQUIRED
    echo "Upgradable packages: $n; unattended-upgrades: $pkg; apt-daily-upgrade.timer enabled=${en:-unknown}, active=${ac:-unknown}"
    echo "Verify patching policy, security updates, additional security software and maintenance records manually."
  args:
    executable: /bin/bash
  register: cis_1_2_2_1_verify
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool

- name: Show recheck result for CIS 1.2.2.1
  ansible.builtin.debug:
    msg: "{{ 'PASS' if ((cis_1_2_2_1_verify.stdout_lines | default([]) | first | default('')) == 'COMPLIANT') else 'NON-COMPLIANT / REVIEW' }} - CIS 1.2.2.1: {{ cis_1_2_2_1_verify.stdout | default('Recheck not run') }}"
  when: cis_remediate | default(false) | bool
