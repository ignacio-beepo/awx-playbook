##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 1.2.1.3 - Automated
##############################################################################
- name: Audit CIS 1.2.1.3 - GPG key and Signed-By source files
  ansible.builtin.shell: |
    python3 - <<'PYCODE'
    from pathlib import Path
    import os, stat, re
    candidates=[]
    for d in (Path('/usr/share/keyrings'), Path('/etc/apt/trusted.gpg.d')):
        if d.exists(): candidates += [p for p in d.rglob('*') if p.is_file() and p.name.endswith('gpg')]
    sd=Path('/etc/apt/sources.list.d')
    if sd.exists():
        for p in sd.iterdir():
            if p.is_file() and (p.name.endswith('.list') or p.name.endswith('.sources')):
                try: txt=p.read_text(errors='replace')
                except OSError: continue
                if re.search(r'\bsigned-by\b',txt,re.I): candidates.append(p)
    bad=[]
    for p in sorted(set(candidates)):
        try:
            s=p.stat(); m=stat.S_IMODE(s.st_mode)
            if s.st_uid != 0 or s.st_gid != 0 or (m & 0o133): bad.append(f'{p} mode={m:04o} uid={s.st_uid} gid={s.st_gid}')
        except OSError as e: bad.append(f'{p}: {e}')
    print('\n'.join(bad) if bad else 'NO_FINDINGS')
    PYCODE
  args: { executable: /bin/bash }
  register: cis_1_2_1_3_audit
  changed_when: false
  failed_when: false
- name: Determine CIS 1.2.1.3 compliance
  ansible.builtin.set_fact:
    cis_1_2_1_3_compliant: "{{ 'NO_FINDINGS' in cis_1_2_1_3_audit.stdout }}"
- name: Report CIS 1.2.1.3 audit result
  ansible.builtin.debug:
    msg: "{{ 'PASS - CIS 1.2.1.3 compliant' if cis_1_2_1_3_compliant else 'FAIL - CIS 1.2.1.3 non-compliant: ' ~ cis_1_2_1_3_audit.stdout }}"
- name: Remediate CIS 1.2.1.3 - secure GPG and Signed-By files
  ansible.builtin.shell: |
    python3 - <<'PYCODE'
    from pathlib import Path
    import os, re
    candidates=[]
    for d in (Path('/usr/share/keyrings'), Path('/etc/apt/trusted.gpg.d')):
        if d.exists(): candidates += [p for p in d.rglob('*') if p.is_file() and p.name.endswith('gpg')]
    sd=Path('/etc/apt/sources.list.d')
    if sd.exists():
        for p in sd.iterdir():
            if p.is_file() and (p.name.endswith('.list') or p.name.endswith('.sources')):
                try: txt=p.read_text(errors='replace')
                except OSError: continue
                if re.search(r'\bsigned-by\b',txt,re.I): candidates.append(p)
    for p in set(candidates): os.chown(p,0,0); os.chmod(p,0o644)
    PYCODE
  args: { executable: /bin/bash }
  register: cis_1_2_1_3_remediation
  changed_when: false
  when:
    - not cis_1_2_1_3_compliant
    - cis_remediate | default(false) | bool
- name: Re-audit CIS 1.2.1.3
  ansible.builtin.shell: |
    python3 - <<'PYCODE'
    from pathlib import Path
    import stat, re
    c=[]
    for d in (Path('/usr/share/keyrings'),Path('/etc/apt/trusted.gpg.d')):
      if d.exists(): c += [p for p in d.rglob('*') if p.is_file() and p.name.endswith('gpg')]
    d=Path('/etc/apt/sources.list.d')
    if d.exists():
      for p in d.iterdir():
       if p.is_file() and (p.name.endswith('.list') or p.name.endswith('.sources')):
        try: t=p.read_text(errors='replace')
        except OSError: continue
        if re.search(r'\bsigned-by\b',t,re.I): c.append(p)
    bad=[]
    for p in set(c):
      s=p.stat(); m=stat.S_IMODE(s.st_mode)
      if s.st_uid!=0 or s.st_gid!=0 or (m & 0o133): bad.append(str(p))
    print('\n'.join(bad) if bad else 'NO_FINDINGS')
    PYCODE
  args: { executable: /bin/bash }
  register: cis_1_2_1_3_verify
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool
- name: Final CIS validation 1.2.1.3
  ansible.builtin.assert:
    that:
      - cis_1_2_1_3_compliant or ((cis_remediate | default(false) | bool) and 'NO_FINDINGS' in cis_1_2_1_3_verify.stdout)
    success_msg: 'PASS - CIS 1.2.1.3 compliant'
    fail_msg: 'FAIL - CIS 1.2.1.3 remains non-compliant'
