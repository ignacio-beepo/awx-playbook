---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 1.2.1.3 | Assessment -> Remediation -> Recheck
# Non-compliance is reported and does not fail the Ansible task.
##############################################################################

- name: Audit CIS 1.2.1.3
  ansible.builtin.shell: |
    python3 - <<'PY'
    import os,stat
    bad=[]; n=0
    for d in ["/etc/apt/trusted.gpg.d","/usr/share/keyrings"]:
     for root,ds,fs in os.walk(d) if os.path.isdir(d) else []:
      for f in fs:
       p=os.path.join(root,f); s=os.stat(p,follow_symlinks=False)
       if not stat.S_ISREG(s.st_mode): continue
       n+=1; m=stat.S_IMODE(s.st_mode)
       if s.st_uid!=0 or s.st_gid!=0 or m&0o133: bad.append(f"{p} owner={s.st_uid}:{s.st_gid} mode={m:04o}")
    if bad: print("NON_COMPLIANT"); print("; ".join(bad))
    elif n: print("COMPLIANT"); print(f"{n} key files pass ownership and permission checks")
    else: print("REVIEW_REQUIRED"); print("No regular key files found")
    PY
  args:
    executable: /bin/bash
  register: cis_1_2_1_3_audit
  changed_when: false
  failed_when: false
- name: Determine compliance status for CIS 1.2.1.3
  ansible.builtin.set_fact:
    cis_1_2_1_3_compliant: "{{ (cis_1_2_1_3_audit.stdout_lines | default([]) | first | default('')) == 'COMPLIANT' }}"

- name: Show audit result for CIS 1.2.1.3
  ansible.builtin.debug:
    msg: "{{ 'PASS' if cis_1_2_1_3_compliant else 'NON-COMPLIANT' }} - CIS 1.2.1.3: {{ cis_1_2_1_3_audit.stdout | default('No audit output') }}"

##############################################################################
# REMEDIATION
##############################################################################

- name: Remediate CIS 1.2.1.3 - set ownership and permissions
  ansible.builtin.shell: |
    find /etc/apt/trusted.gpg.d /usr/share/keyrings -type f -exec chown root:root {} + -exec chmod u-x,go-wx {} +
  args:
    executable: /bin/bash
  changed_when: true
  when: not cis_1_2_1_3_compliant and (cis_remediate | default(false) | bool)

##############################################################################
# RECHECK
##############################################################################

- name: Recheck CIS 1.2.1.3
  ansible.builtin.shell: |
    python3 - <<'PY'
    import os,stat
    bad=[]; n=0
    for d in ["/etc/apt/trusted.gpg.d","/usr/share/keyrings"]:
     for root,ds,fs in os.walk(d) if os.path.isdir(d) else []:
      for f in fs:
       p=os.path.join(root,f); s=os.stat(p,follow_symlinks=False)
       if not stat.S_ISREG(s.st_mode): continue
       n+=1; m=stat.S_IMODE(s.st_mode)
       if s.st_uid!=0 or s.st_gid!=0 or m&0o133: bad.append(f"{p} owner={s.st_uid}:{s.st_gid} mode={m:04o}")
    if bad: print("NON_COMPLIANT"); print("; ".join(bad))
    elif n: print("COMPLIANT"); print(f"{n} key files pass ownership and permission checks")
    else: print("REVIEW_REQUIRED"); print("No regular key files found")
    PY
  args:
    executable: /bin/bash
  register: cis_1_2_1_3_verify
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool

- name: Show recheck result for CIS 1.2.1.3
  ansible.builtin.debug:
    msg: "{{ 'PASS' if ((cis_1_2_1_3_verify.stdout_lines | default([]) | first | default('')) == 'COMPLIANT') else 'NON-COMPLIANT / REVIEW' }} - CIS 1.2.1.3: {{ cis_1_2_1_3_verify.stdout | default('Recheck not run') }}"
  when: cis_remediate | default(false) | bool
