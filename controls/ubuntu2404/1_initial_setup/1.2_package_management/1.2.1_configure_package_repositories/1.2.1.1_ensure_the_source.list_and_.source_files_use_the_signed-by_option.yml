---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 1.2.1.1 | Assessment -> Remediation -> Recheck
# Non-compliance is reported and does not fail the Ansible task.
##############################################################################

- name: Audit CIS 1.2.1.1
  ansible.builtin.shell: |
    python3 - <<'PY'
    import glob,os,re
    paths=["/etc/apt/sources.list"]+glob.glob("/etc/apt/sources.list.d/*.list")+glob.glob("/etc/apt/sources.list.d/*.sources")
    bad=[]; n=0
    for p in paths:
     if not os.path.isfile(p): continue
     data=open(p,encoding="utf-8",errors="replace").read()
     if p.endswith(".sources"):
      for i,st in enumerate(re.split(r"\n\s*\n",data),1):
       f={}
       for l in st.splitlines():
        if l and not l[0].isspace() and ":" in l:
         k,v=l.split(":",1); f[k.strip().lower()]=v.strip()
       if f and f.get("enabled","yes").lower()!="no" and ("uris" in f or "types" in f):
        n+=1
        if not f.get("signed-by"): bad.append(f"{p}: stanza {i} missing Signed-By")
     else:
      for i,l in enumerate(data.splitlines(),1):
       s=l.strip()
       if not s or s.startswith("#") or not re.match(r"^deb(?:-src)?\s",s): continue
       n+=1; m=re.match(r"^deb(?:-src)?\s+\[([^\]]*)\]",s)
       if not m or not re.search(r"(^|\s)signed-by\s*=",m.group(1),re.I): bad.append(f"{p}:{i} missing Signed-By")
    if bad: print("NON_COMPLIANT"); print("; ".join(bad))
    elif n: print("COMPLIANT"); print(f"{n} active APT entries have Signed-By")
    else: print("REVIEW_REQUIRED"); print("No active source entries found")
    PY
  args:
    executable: /bin/bash
  register: cis_1_2_1_1_audit
  changed_when: false
  failed_when: false
- name: Record manual review status for CIS 1.2.1.1
  ansible.builtin.set_fact:
    cis_1_2_1_1_compliant: "{{ (cis_1_2_1_1_audit.stdout_lines | default([]) | first | default('')) == 'COMPLIANT' }}"
    cis_1_2_1_1_manual_review: true

- name: Show audit result for CIS 1.2.1.1
  ansible.builtin.debug:
    msg: "MANUAL REVIEW - CIS 1.2.1.1: {{ cis_1_2_1_1_audit.stdout | default('No audit output') }}"

##############################################################################
# REMEDIATION
##############################################################################

- name: Manual remediation notice for CIS 1.2.1.1
  ansible.builtin.debug:
    msg: >-
      Assign an approved repository-specific keyring and add Signed-By to each active .list/.sources entry. This is intentionally not guessed or modified automatically.
  when: cis_remediate | default(false) | bool

##############################################################################
# RECHECK
##############################################################################

- name: Recheck CIS 1.2.1.1
  ansible.builtin.shell: |
    python3 - <<'PY'
    import glob,os,re
    paths=["/etc/apt/sources.list"]+glob.glob("/etc/apt/sources.list.d/*.list")+glob.glob("/etc/apt/sources.list.d/*.sources")
    bad=[]; n=0
    for p in paths:
     if not os.path.isfile(p): continue
     data=open(p,encoding="utf-8",errors="replace").read()
     if p.endswith(".sources"):
      for i,st in enumerate(re.split(r"\n\s*\n",data),1):
       f={}
       for l in st.splitlines():
        if l and not l[0].isspace() and ":" in l:
         k,v=l.split(":",1); f[k.strip().lower()]=v.strip()
       if f and f.get("enabled","yes").lower()!="no" and ("uris" in f or "types" in f):
        n+=1
        if not f.get("signed-by"): bad.append(f"{p}: stanza {i} missing Signed-By")
     else:
      for i,l in enumerate(data.splitlines(),1):
       s=l.strip()
       if not s or s.startswith("#") or not re.match(r"^deb(?:-src)?\s",s): continue
       n+=1; m=re.match(r"^deb(?:-src)?\s+\[([^\]]*)\]",s)
       if not m or not re.search(r"(^|\s)signed-by\s*=",m.group(1),re.I): bad.append(f"{p}:{i} missing Signed-By")
    if bad: print("NON_COMPLIANT"); print("; ".join(bad))
    elif n: print("COMPLIANT"); print(f"{n} active APT entries have Signed-By")
    else: print("REVIEW_REQUIRED"); print("No active source entries found")
    PY
  args:
    executable: /bin/bash
  register: cis_1_2_1_1_verify
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool

- name: Show recheck result for CIS 1.2.1.1
  ansible.builtin.debug:
    msg: "{{ 'PASS' if ((cis_1_2_1_1_verify.stdout_lines | default([]) | first | default('')) == 'COMPLIANT') else 'NON-COMPLIANT / REVIEW' }} - CIS 1.2.1.1: {{ cis_1_2_1_1_verify.stdout | default('Recheck not run') }}"
  when: cis_remediate | default(false) | bool
