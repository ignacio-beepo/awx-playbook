---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 2.1.23 - x window server services are not in use
##############################################################################

- name: Assessment - CIS 2.1.23
  ansible.builtin.shell: |
    if dpkg-query -s xserver-common >/dev/null 2>&1; then
      echo "NON_COMPLIANT: xserver-common is installed"
    else
      echo "COMPLIANT: xserver-common is not installed"
    fi
  args:
    executable: /bin/bash
  register: cis_2_1_23_audit
  changed_when: false
  failed_when: false

- name: Set compliance status - CIS 2.1.23
  ansible.builtin.set_fact:
    cis_2_1_23_compliant: "{{ 'COMPLIANT:' in (cis_2_1_23_audit.stdout | default('')) }}"

- name: Report assessment - CIS 2.1.23
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.23 compliant'
        if cis_2_1_23_compliant
        else 'REVIEW/FAIL - CIS 2.1.23: ' ~ (cis_2_1_23_audit.stdout | default('No audit output'))
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Remediation - CIS 2.1.23
  ansible.builtin.shell: |
    if dpkg-query -s xserver-common >/dev/null 2>&1; then
      apt-get -y purge xserver-common
      echo "REMEDIATION_XSERVER_COMMON_PURGED"
    else
      echo "NO_REMEDIATION_NEEDED"
    fi
  args:
    executable: /bin/bash
  register: cis_2_1_23_remediation
  changed_when: "'REMEDIATION_' in (cis_2_1_23_remediation.stdout | default(''))"
  failed_when: false
  when:
    - not cis_2_1_23_compliant
    - cis_remediate | default(false) | bool

- name: Remediation guidance - CIS 2.1.23
  ansible.builtin.debug:
    msg: >-
      Level 2 - Server. Purging xserver-common can affect graphical desktop managers and GUI-dependent applications. Confirm X Windows is not required before enabling package purge.
  when:
    - not cis_2_1_23_compliant
    - cis_remediate | default(false) | bool

##############################################################################
# RECHECK
##############################################################################

- name: Recheck - CIS 2.1.23
  ansible.builtin.shell: |
    if dpkg-query -s xserver-common >/dev/null 2>&1; then
      echo "NON_COMPLIANT: xserver-common is installed"
    else
      echo "COMPLIANT: xserver-common is not installed"
    fi
  args:
    executable: /bin/bash
  register: cis_2_1_23_recheck
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool

- name: Report recheck - CIS 2.1.23
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.23 compliant after remediation'
        if ('COMPLIANT' in (cis_2_1_23_recheck.stdout | default('')) and 'NON_COMPLIANT' not in (cis_2_1_23_recheck.stdout | default('')))
        else 'RECHECK REQUIRED - CIS 2.1.23: ' ~ (cis_2_1_23_recheck.stdout | default('No recheck output'))
      }}
  when: cis_remediate | default(false) | bool
