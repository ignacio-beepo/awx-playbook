---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 2.1.1 - autofs services are not in use
##############################################################################

- name: Assessment - CIS 2.1.1
  ansible.builtin.shell: |
    installed=0
    enabled=0
    active=0

    if dpkg-query -s autofs >/dev/null 2>&1; then
      installed=1
    fi

    state="$(systemctl is-enabled autofs.service 2>/dev/null || true)"
    active_state="$(systemctl is-active autofs.service 2>/dev/null || true)"

    if [[ "$state" == "enabled" || "$state" == "enabled-runtime" ]]; then
      enabled=1
    fi

    if [[ "$active_state" == "active" ]]; then
      active=1
    fi

    if [[ "$installed" -eq 0 ]]; then
      echo "COMPLIANT: target package not installed"
    elif [[ "$enabled" -eq 0 && "$active" -eq 0 ]]; then
      echo "COMPLIANT: package installed but service inactive and not enabled"
    else
      echo "NON_COMPLIANT: package/service in use"
    fi

    echo "Package installed: $installed"
    echo "Service state: $state"
    echo "Service active: $active_state"

  args:
    executable: /bin/bash
  register: cis_2_1_1_audit
  changed_when: false
  failed_when: false

- name: Set compliance status - CIS 2.1.1
  ansible.builtin.set_fact:
    cis_2_1_1_compliant: "{{ 'COMPLIANT:' in (cis_2_1_1_audit.stdout | default('')) }}"

- name: Report assessment - CIS 2.1.1
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.1 compliant'
        if cis_2_1_1_compliant
        else 'REVIEW/FAIL - CIS 2.1.1: ' ~ (cis_2_1_1_audit.stdout | default('No audit output'))
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Remediation - CIS 2.1.1
  ansible.builtin.shell: |
    packages=('autofs')
    units=('autofs.service')
    echo "Remediation mode: {{ cis_21_package_remediation | default('mask') }}"
    if [ "{{ cis_21_package_remediation | default('mask') }}" = "purge" ]; then
      for unit in "${units[@]}"; do systemctl stop "$unit" 2>/dev/null || true; done
      apt-get -y purge "${packages[@]}"
      echo "REMEDIATION_PACKAGES_PURGED"
    else
      for unit in "${units[@]}"; do
        systemctl stop "$unit" 2>/dev/null || true
        systemctl mask "$unit" 2>/dev/null || true
      done
      systemctl daemon-reload
      echo "REMEDIATION_SERVICES_STOPPED_AND_MASKED"
    fi
  args:
    executable: /bin/bash
  register: cis_2_1_1_remediation
  changed_when: "'REMEDIATION_' in (cis_2_1_1_remediation.stdout | default(''))"
  failed_when: false
  when:
    - not cis_2_1_1_compliant
    - cis_remediate | default(false) | bool

- name: Remediation guidance - CIS 2.1.1
  ansible.builtin.debug:
    msg: >-
      Default remediation masks the listed service/socket units and retains packages. Set `cis_21_package_remediation: purge` only after checking dependencies and approving package removal. The default is deliberately conservative.
  when:
    - not cis_2_1_1_compliant
    - cis_remediate | default(false) | bool

##############################################################################
# RECHECK
##############################################################################

- name: Recheck - CIS 2.1.1
  ansible.builtin.shell: |
    packages=('autofs')
    units=('autofs.service')
    installed=()
    enabled=()
    active=()
    for pkg in "${packages[@]}"; do
      dpkg-query -s "$pkg" >/dev/null 2>&1 && installed+=("$pkg")
    done
    for unit in "${units[@]}"; do
      state="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
      active_state="$(systemctl is-active "$unit" 2>/dev/null || true)"
      [[ "$state" == "enabled" || "$state" == "enabled-runtime" || "$state" == "static" ]] && enabled+=("$unit:$state")
      [[ "$active_state" == "active" ]] && active+=("$unit")
    done
    if [ "${#installed[@]}" -eq 0 ]; then
      echo "COMPLIANT: target package(s) not installed"
    elif [ "${#enabled[@]}" -eq 0 ] && [ "${#active[@]}" -eq 0 ]; then
      echo "COMPLIANT: package installed but service(s) inactive and not enabled"
    else
      echo "NON_COMPLIANT: package/service in use"
    fi
    printf 'Installed packages: %s\\n' "${installed[*]:-none}"
    printf 'Enabled/static units: %s\\n' "${enabled[*]:-none}"
    printf 'Active units: %s\\n' "${active[*]:-none}"

  args:
    executable: /bin/bash
  register: cis_2_1_1_recheck
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool

- name: Report recheck - CIS 2.1.1
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.1 compliant after remediation'
        if ('COMPLIANT' in (cis_2_1_1_recheck.stdout | default('')) and 'NON_COMPLIANT' not in (cis_2_1_1_recheck.stdout | default('')))
        else 'RECHECK REQUIRED - CIS 2.1.1: ' ~ (cis_2_1_1_recheck.stdout | default('No recheck output'))
      }}
  when: cis_remediate | default(false) | bool
