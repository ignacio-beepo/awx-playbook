---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 2.1.1 - autofs services are not in use
##############################################################################

- name: Assessment - CIS 2.1.1
  ansible.builtin.shell:
    cmd: |
      package="autofs"
      unit="autofs.service"

      installed="no"
      enabled="no"
      active="no"

      if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q "install ok installed"; then
        installed="yes"
      fi

      state="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
      active_state="$(systemctl is-active "$unit" 2>/dev/null || true)"

      if [[ "$state" == "enabled" || "$state" == "enabled-runtime" ]]; then
        enabled="yes"
      fi

      if [[ "$active_state" == "active" ]]; then
        active="yes"
      fi

      if [[ "$installed" == "no" ]]; then
        echo "COMPLIANT: package not installed"
      elif [[ "$enabled" == "no" && "$active" == "no" ]]; then
        echo "COMPLIANT: package installed but service inactive and disabled"
      else
        echo "NON_COMPLIANT: package/service in use"
      fi

      echo "Installed: $installed"
      echo "Enabled: $state"
      echo "Active: $active_state"
    executable: /bin/bash
  register: cis_2_1_1_audit
  changed_when: false
  failed_when: false

- name: Set compliance status - CIS 2.1.1
  ansible.builtin.set_fact:
    cis_2_1_1_compliant: "{{ 'COMPLIANT:' in (cis_2_1_1_audit.stdout | default('')) }}"

- name: Report assessment - CIS 2.1.1
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.1 compliant'
        if cis_2_1_1_compliant
        else 'FAIL - CIS 2.1.1: ' ~ (cis_2_1_1_audit.stdout | default('No audit output'))
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Remediation - CIS 2.1.1
  ansible.builtin.shell:
    cmd: |
      package="autofs"
      unit="autofs.service"
      mode="{{ cis_21_package_remediation | default('mask') }}"

      if [[ "$mode" == "purge" ]]; then
        systemctl disable --now "$unit" 2>/dev/null || true
        apt-get -y purge "$package"
        echo "REMEDIATION_PACKAGES_PURGED"
      else
        systemctl disable --now "$unit" 2>/dev/null || true
        systemctl mask "$unit"
        systemctl daemon-reload
        echo "REMEDIATION_SERVICES_STOPPED_AND_MASKED"
      fi
    executable: /bin/bash
  register: cis_2_1_1_remediation
  changed_when: "'REMEDIATION_' in (cis_2_1_1_remediation.stdout | default(''))"
  failed_when: false
  when:
    - not cis_2_1_1_compliant
    - cis_remediate | default(false) | bool

##############################################################################
# RECHECK
##############################################################################

- name: Recheck - CIS 2.1.1
  ansible.builtin.shell:
    cmd: |
      package="autofs"
      unit="autofs.service"

      installed="no"
      if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q "install ok installed"; then
        installed="yes"
      fi

      state="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
      active_state="$(systemctl is-active "$unit" 2>/dev/null || true)"

      if [[ "$installed" == "no" ]]; then
        echo "COMPLIANT: package not installed"
      elif [[ "$state" != "enabled" && "$state" != "enabled-runtime" && "$active_state" != "active" ]]; then
        echo "COMPLIANT: package installed but service inactive and disabled"
      else
        echo "NON_COMPLIANT: package/service in use"
      fi

      echo "Installed: $installed"
      echo "Enabled: $state"
      echo "Active: $active_state"
    executable: /bin/bash
  register: cis_2_1_1_recheck
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool

- name: Report recheck - CIS 2.1.1
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.1 compliant after remediation'
        if (
          'COMPLIANT:' in (cis_2_1_1_recheck.stdout | default(''))
          and
          'NON_COMPLIANT:' not in (cis_2_1_1_recheck.stdout | default(''))
        )
        else 'RECHECK REQUIRED - CIS 2.1.1: ' ~ (cis_2_1_1_recheck.stdout | default('No recheck output'))
      }}
  when: cis_remediate | default(false) | bool
