---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 2.1.4 - only approved services are listening on a network interface
##############################################################################

- name: Assessment - CIS 2.1.4
  ansible.builtin.shell: |
    echo "MANUAL_REVIEW_REQUIRED"
    echo "Listening TCP/UDP sockets (CIS audit command: ss -plntu):"
    ss -plntu 2>/dev/null || true
    echo
    echo "Review every listening service, port, protocol, and bound interface against local site policy."
    echo "A reviewer must record whether each listener is approved; the playbook cannot infer organizational approval."
  args:
    executable: /bin/bash
  register: cis_2_1_4_audit
  changed_when: false
  failed_when: false

- name: Set compliance status - CIS 2.1.4
  ansible.builtin.set_fact:
    cis_2_1_4_compliant: "{{ false }}"

- name: Report assessment - CIS 2.1.4
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.4 compliant'
        if cis_2_1_4_compliant
        else 'REVIEW/FAIL - CIS 2.1.4: ' ~ (cis_2_1_4_audit.stdout | default('No audit output'))
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Remediation - CIS 2.1.4
  ansible.builtin.shell: |
    echo "MANUAL_REMEDIATION_REQUIRED"
    echo "For each unapproved listener, identify its owning package and service."
    echo "Remove the package if not required; if retained for a dependency, stop and mask its socket/service."
    echo "No listener is automatically stopped because approval is organization-specific."
  args:
    executable: /bin/bash
  register: cis_2_1_4_remediation
  changed_when: "'REMEDIATION_' in (cis_2_1_4_remediation.stdout | default(''))"
  failed_when: false
  when:
    - not cis_2_1_4_compliant
    - cis_remediate | default(false) | bool

- name: Remediation guidance - CIS 2.1.4
  ansible.builtin.debug:
    msg: >-
      Manual CIS recommendation. Compare `ss -plntu` output with the approved service inventory and document exceptions. No automatic remediation is performed.
  when:
    - not cis_2_1_4_compliant
    - cis_remediate | default(false) | bool

##############################################################################
# RECHECK
##############################################################################

- name: Recheck - CIS 2.1.4
  ansible.builtin.shell: |
    echo "MANUAL_REVIEW_REQUIRED"
    echo "Listening TCP/UDP sockets (CIS audit command: ss -plntu):"
    ss -plntu 2>/dev/null || true
    echo
    echo "Review every listening service, port, protocol, and bound interface against local site policy."
    echo "A reviewer must record whether each listener is approved; the playbook cannot infer organizational approval."
  args:
    executable: /bin/bash
  register: cis_2_1_4_recheck
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool

- name: Report recheck - CIS 2.1.4
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.4 compliant after remediation'
        if ('COMPLIANT' in (cis_2_1_4_recheck.stdout | default('')) and 'NON_COMPLIANT' not in (cis_2_1_4_recheck.stdout | default('')))
        else 'RECHECK REQUIRED - CIS 2.1.4: ' ~ (cis_2_1_4_recheck.stdout | default('No recheck output'))
      }}
  when: cis_remediate | default(false) | bool
