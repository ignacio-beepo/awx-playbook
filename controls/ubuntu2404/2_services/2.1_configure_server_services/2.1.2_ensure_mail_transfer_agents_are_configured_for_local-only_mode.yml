---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 2.1.2 - mail transfer agents are configured for local-only mode
##############################################################################

- name: Assessment - CIS 2.1.2
  ansible.builtin.script:
    cmd: scripts/2.1.2_audit.sh
  register: cis_2_1_2_audit
  changed_when: false
  failed_when: false

- name: Set compliance status - CIS 2.1.2
  ansible.builtin.set_fact:
    cis_2_1_2_compliant: "{{ 'COMPLIANT' in (cis_2_1_2_audit.stdout | default('')) and 'NON_COMPLIANT' not in (cis_2_1_2_audit.stdout | default('')) }}"

- name: Report assessment - CIS 2.1.2
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.2 compliant'
        if cis_2_1_2_compliant
        else 'REVIEW/FAIL - CIS 2.1.2: ' ~ (cis_2_1_2_audit.stdout | default('No audit output'))
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Remediation - CIS 2.1.2
  ansible.builtin.shell: |
    if command -v postconf >/dev/null 2>&1; then
      if grep -Eq '^[[:space:]]*inet_interfaces[[:space:]]*=' /etc/postfix/main.cf; then
        sed -i 's/^[[:space:]]*inet_interfaces[[:space:]]*=.*/inet_interfaces = loopback-only/' /etc/postfix/main.cf
      else
        printf '\ninet_interfaces = loopback-only\n' >> /etc/postfix/main.cf
      fi
      postfix check && systemctl restart postfix
      echo "REMEDIATION_POSTFIX_LOOPBACK_ONLY"
    else
      echo "MANUAL_REMEDIATION_REQUIRED: Configure Exim/Sendmail/other MTA to bind only to loopback."
    fi
  args:
    executable: /bin/bash
  register: cis_2_1_2_remediation
  changed_when: "'REMEDIATION_' in (cis_2_1_2_remediation.stdout | default(''))"
  failed_when: false
  when:
    - not cis_2_1_2_compliant
    - cis_remediate | default(false) | bool

- name: Remediation guidance - CIS 2.1.2
  ansible.builtin.debug:
    msg: >-
      Automated change applies only to Postfix. Exim, Sendmail, and other MTAs require vendor/site-specific configuration. The audit also checks SMTP listener ports 25, 465, and 587.
  when:
    - not cis_2_1_2_compliant
    - cis_remediate | default(false) | bool

##############################################################################
# RECHECK
##############################################################################

- name: Recheck - CIS 2.1.2
  ansible.builtin.script:
    cmd: scripts/2.1.2_recheck.sh
  args:
    executable: /bin/bash
  register: cis_2_1_2_recheck
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool

- name: Report recheck - CIS 2.1.2
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.2 compliant after remediation'
        if ('COMPLIANT' in (cis_2_1_2_recheck.stdout | default('')) and 'NON_COMPLIANT' not in (cis_2_1_2_recheck.stdout | default('')))
        else 'RECHECK REQUIRED - CIS 2.1.2: ' ~ (cis_2_1_2_recheck.stdout | default('No recheck output'))
      }}
  when: cis_remediate | default(false) | bool
