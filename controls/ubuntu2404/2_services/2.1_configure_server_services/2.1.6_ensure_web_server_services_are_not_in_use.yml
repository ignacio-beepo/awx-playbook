---
##############################################################################
# CIS Ubuntu Linux 24.04 LTS Benchmark v2.0.0
# CIS 2.1.6 - web server services are not in use
##############################################################################

- name: Assessment - CIS 2.1.6
  ansible.builtin.script:
    cmd: scripts/2.1.6_audit.sh
  register: cis_2_1_6_audit
  changed_when: false
  failed_when: false

- name: Set compliance status - CIS 2.1.6
  ansible.builtin.set_fact:
    cis_2_1_6_compliant: "{{ 'COMPLIANT:' in (cis_2_1_6_audit.stdout | default('')) }}"

- name: Report assessment - CIS 2.1.6
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.6 compliant'
        if cis_2_1_6_compliant
        else 'REVIEW/FAIL - CIS 2.1.6: ' ~ (cis_2_1_6_audit.stdout | default('No audit output'))
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Remediation - CIS 2.1.6
  ansible.builtin.shell: |
    packages=('apache2' 'nginx')
    units=('apache2.socket' 'apache2.service' 'nginx.service')
    echo "Remediation mode: {{ cis_21_package_remediation | default('mask') }}"
    if [ "{{ cis_21_package_remediation | default('mask') }}" = "purge" ]; then
      for unit in "${units[@]}"; do systemctl stop "$unit" 2>/dev/null || true; done
      apt-get -y purge "${packages[@]}"
      echo "REMEDIATION_PACKAGES_PURGED"
    else
      for unit in "${units[@]}"; do
        systemctl stop "$unit" 2>/dev/null || true
        systemctl mask "$unit" 2>/dev/null || true
      done
      systemctl daemon-reload
      echo "REMEDIATION_SERVICES_STOPPED_AND_MASKED"
    fi
  args:
    executable: /bin/bash
  register: cis_2_1_6_remediation
  changed_when: "'REMEDIATION_' in (cis_2_1_6_remediation.stdout | default(''))"
  failed_when: false
  when:
    - not cis_2_1_6_compliant
    - cis_remediate | default(false) | bool

- name: Remediation guidance - CIS 2.1.6
  ansible.builtin.debug:
    msg: >-
      Default remediation masks the listed service/socket units and retains packages. Set `cis_21_package_remediation: purge` only after checking dependencies and approving package removal. The default is deliberately conservative.
  when:
    - not cis_2_1_6_compliant
    - cis_remediate | default(false) | bool

##############################################################################
# RECHECK
##############################################################################

- name: Recheck - CIS 2.1.6
  ansible.builtin.script:
    cmd: scripts/2.1.6_recheck.sh
  register: cis_2_1_6_recheck
  changed_when: false
  failed_when: false
  when: cis_remediate | default(false) | bool

- name: Report recheck - CIS 2.1.6
  ansible.builtin.debug:
    msg: >-
      {{
        'PASS - CIS 2.1.6 compliant after remediation'
        if ('COMPLIANT' in (cis_2_1_6_recheck.stdout | default('')) and 'NON_COMPLIANT' not in (cis_2_1_6_recheck.stdout | default('')))
        else 'RECHECK REQUIRED - CIS 2.1.6: ' ~ (cis_2_1_6_recheck.stdout | default('No recheck output'))
      }}
  when: cis_remediate | default(false) | bool
