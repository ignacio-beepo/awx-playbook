---
##############################################################################
# AUDIT
##############################################################################

- name: Audit duplicate group names
  shell: |
    awk -F: '{print $1}' /etc/group | sort | uniq -c | awk '$1 > 1 {print $2}'
  register: duplicate_group_names
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    duplicate_group_names_compliant: "{{ duplicate_group_names.stdout_lines | length == 0 }}"

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - No duplicate group names exist'
        if duplicate_group_names_compliant
        else
        'FAIL - Duplicate group names detected. Manual remediation required.'
      }}

##############################################################################
# COLLECT DETAILS
##############################################################################

- name: Collect duplicate group details
  shell: |
    for grp in $(awk -F: '{print $1}' /etc/group | sort | uniq -d); do
      echo "===== GROUP: ${grp} ====="
      grep "^${grp}:" /etc/group
      echo
    done
  register: duplicate_group_details
  changed_when: false
  failed_when: false
  when: not duplicate_group_names_compliant

- name: Display duplicate group details
  debug:
    msg: |
      Duplicate Group Entries Found:

      {{ duplicate_group_details.stdout }}

      Recommended Remediation:
      1. Review duplicate group entries above
      2. Determine which entry should remain
      3. Rename or remove duplicate group(s)
      4. Re-run the CIS audit

      Example:
      groupmod -n <new_group_name> <old_group_name>

  when: not duplicate_group_names_compliant

##############################################################################
# RECHECK
##############################################################################

- name: Re-audit duplicate group names
  shell: |
    awk -F: '{print $1}' /etc/group | sort | uniq -d
  register: duplicate_group_names_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - duplicate_group_names_verify.stdout_lines | length == 0

    success_msg: |
      PASS - CIS 7.2.8 compliant

      Validation Result:
      - No duplicate group names found

    fail_msg: |
      FAIL - CIS 7.2.8 non-compliant

      Duplicate Group Entries:

      {{ duplicate_group_details.stdout | default(duplicate_group_names_verify.stdout) }}
