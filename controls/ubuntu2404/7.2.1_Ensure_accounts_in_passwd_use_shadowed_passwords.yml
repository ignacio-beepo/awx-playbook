---
##############################################################################
# AUDIT
##############################################################################

- name: Audit accounts not using shadowed passwords
  shell: |
    awk -F: '
    ($2 != "x" && $2 != "*" && $2 != "!" && $2 != "") {
      print $1 ":" $2
    }' /etc/passwd
  register: passwd_shadow_audit
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    passwd_shadow_compliant: "{{ passwd_shadow_audit.stdout_lines | length == 0 }}"

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - All accounts use shadowed passwords'
        if passwd_shadow_compliant
        else
        'FAIL - Accounts not using shadowed passwords detected. Starting remediation...'
      }}

##############################################################################
# COLLECT DETAILS
##############################################################################

- name: Display affected accounts
  debug:
    msg: |
      Accounts not using shadowed passwords:

      {{ passwd_shadow_audit.stdout }}

  when: not passwd_shadow_compliant

##############################################################################
# REMEDIATION
##############################################################################

- name: Convert local passwords to shadow passwords
  command: pwconv
  register: pwconv_result
  when: not passwd_shadow_compliant
  changed_when: true
  failed_when: false

- name: Show remediation result
  debug:
    msg: |
      Password database converted to shadow format using pwconv.

      Result:
      {{ pwconv_result.stdout | default('pwconv executed successfully') }}

  when:
    - not passwd_shadow_compliant
    - pwconv_result is defined

##############################################################################
# RECHECK AFTER REMEDIATION
##############################################################################

- name: Re-audit accounts not using shadowed passwords
  shell: |
    awk -F: '
    ($2 != "x" && $2 != "*" && $2 != "!" && $2 != "") {
      print $1 ":" $2
    }' /etc/passwd
  register: passwd_shadow_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - passwd_shadow_verify.stdout_lines | length == 0

    success_msg: |
      PASS - CIS 7.2.1 compliant

      Validation Result:
      - All local accounts use shadowed passwords
      - Password hashes are stored in /etc/shadow
      - /etc/passwd contains no exposed password hashes

    fail_msg: |
      FAIL - CIS 7.2.1 non-compliant

      Accounts not using shadowed passwords:

      {{ passwd_shadow_verify.stdout | default('Unknown') }}
