---
##############################################################################
# AUDIT
##############################################################################

- name: Audit empty password fields in /etc/shadow
  shell: |
    awk -F: '($2 == "") { print $1 }' /etc/shadow
  register: empty_shadow_passwords
  changed_when: false
  failed_when: false

- name: Determine compliance status
  set_fact:
    shadow_passwords_compliant: "{{ empty_shadow_passwords.stdout_lines | length == 0 }}"

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - No accounts with empty password fields found'
        if shadow_passwords_compliant
        else
        'FAIL - Accounts with empty password fields found. Starting remediation...'
      }}

##############################################################################
# COLLECT DETAILS
##############################################################################

- name: Display affected accounts
  debug:
    msg: |
      Accounts with empty password fields:

      {{ empty_shadow_passwords.stdout }}

  when: not shadow_passwords_compliant

##############################################################################
# REMEDIATION
##############################################################################

- name: Lock accounts with empty password fields
  shell: |
    awk -F: '($2 == "") { print $1 }' /etc/shadow | while read user; do
      passwd -l "$user"
      echo "Locked account: $user"
    done
  register: remediation_result
  when: not shadow_passwords_compliant
  changed_when: true
  failed_when: false

- name: Show remediation result
  debug:
    msg: "{{ remediation_result.stdout }}"
  when:
    - not shadow_passwords_compliant
    - remediation_result is defined

##############################################################################
# RECHECK AFTER REMEDIATION
##############################################################################

- name: Re-audit empty password fields
  shell: |
    awk -F: '
    ($2 == "") {
      print $1
    }' /etc/shadow
  register: empty_shadow_passwords_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - empty_shadow_passwords_verify.stdout_lines | length == 0

    success_msg: |
      PASS - CIS 7.2.2 compliant

      Validation Result:
      - No accounts with empty password fields found
      - Accounts with empty passwords have been locked

    fail_msg: |
      FAIL - CIS 7.2.2 non-compliant

      Accounts still having empty password fields:

      {{ empty_shadow_passwords_verify.stdout | default('Unknown') }}
