---
##############################################################################
# AUDIT
##############################################################################

- name: Check if /etc/passwd exists
  stat:
    path: /etc/passwd
  register: passwd_file

- name: Audit /etc/passwd permissions and ownership
  shell: |
    stat -Lc '%a|%u|%g' /etc/passwd
  register: passwd_audit
  changed_when: false
  failed_when: false
  when: passwd_file.stat.exists

- name: Determine compliance status
  set_fact:
    passwd_compliant: >-
      {{
        passwd_file.stat.exists
        and
        (
          (passwd_audit.stdout.split('|')[0] | int <= 644)
          and
          (passwd_audit.stdout.split('|')[1] == '0')
          and
          (passwd_audit.stdout.split('|')[2] == '0')
        )
      }}

- name: Show audit result
  debug:
    msg: >-
      {{
        'PASS - /etc/passwd access is correctly configured'
        if passwd_compliant
        else
        'FAIL - Incorrect permissions detected. Starting remediation...'
      }}

##############################################################################
# REMEDIATION
##############################################################################

- name: Configure ownership and permissions on /etc/passwd
  file:
    path: /etc/passwd
    owner: root
    group: root
    mode: "0644"
  when:
    - passwd_file.stat.exists
    - not passwd_compliant

##############################################################################
# RECHECK
##############################################################################

- name: Recheck /etc/passwd permissions and ownership
  shell: |
    stat -Lc '%a|%u|%g' /etc/passwd
  register: passwd_verify
  changed_when: false
  failed_when: false

##############################################################################
# FINAL CIS VALIDATION
##############################################################################

- name: Final CIS Validation
  assert:
    that:
      - passwd_verify.stdout is defined
      - "(passwd_verify.stdout.split('|')[0] | int) <= 644"
      - "passwd_verify
